<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · PeerBander Beyonder</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/enhancements.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="brand login-brand"><span class="mark">PB</span><strong>PeerBander Beyonder</strong><small>0.0.5</small></div>
    <article class="panel login-panel">
      <h1 id="authTitle">正在检查后台状态…</h1>
      <p id="authDescription" class="hint">请稍候</p>
      <form id="authForm" class="login-form hidden">
        <label>管理员账号<input id="authUsername" name="username" autocomplete="username" minlength="3" maxlength="64" required></label>
        <label>管理员密码<input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
        <label id="confirmPasswordGroup" class="hidden">再次输入密码<input id="authPasswordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128"></label>
        <p id="authError" class="login-error hidden"></p>
        <button id="authSubmit" class="primary" type="submit">继续</button>
      </form>
    </article>
    <p class="login-note">管理员凭据保存在映射到 <code>/data</code> 的配置目录中，密码不会明文保存。</p>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
