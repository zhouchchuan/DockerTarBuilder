name: Build WuAiZhiBo iOS v1.0

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Restore brand artwork
        shell: bash
        run: |
          cd wuaizhibo-ios-v1.0
          python3 - <<'PY'
          from pathlib import Path
          import base64
          raw = base64.b64decode(Path('brand/icon-flat.png.b64').read_text(encoding='utf-8').strip())
          Path('WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-1024.png').write_bytes(raw)
          Path('WuAiZhiBo/Assets.xcassets/BrandLogo.imageset/BrandLogo.png').write_bytes(raw)
          PY
          file WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-1024.png

      - name: Build unsigned device app
        shell: bash
        run: |
          cd wuaizhibo-ios-v1.0
          rm -rf build
          mkdir -p build/Release-iphoneos
          xcodebuild \
            -project WuAiZhiBo.xcodeproj \
            -target WuAiZhiBo \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA and source
        shell: bash
        run: |
          cd wuaizhibo-ios-v1.0
          APP_PATH="$PWD/build/Release-iphoneos/WuAiZhiBo.app"
          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload" out
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/wuaizhibo-ios-v1.0/out/WuAiZhiBo-iOS-v1.0-unsigned.ipa" Payload)
          cd "$GITHUB_WORKSPACE"
          zip -qry "wuaizhibo-ios-v1.0/out/WuAiZhiBo-iOS-v1.0-source.zip" wuaizhibo-ios-v1.0 -x 'wuaizhibo-ios-v1.0/build/*' 'wuaizhibo-ios-v1.0/out/*'
          shasum -a 256 wuaizhibo-ios-v1.0/out/WuAiZhiBo-iOS-v1.0-unsigned.ipa > wuaizhibo-ios-v1.0/out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wuaizhibo-ios-v1.0-build
          path: wuaizhibo-ios-v1.0/out/
          if-no-files-found: error
