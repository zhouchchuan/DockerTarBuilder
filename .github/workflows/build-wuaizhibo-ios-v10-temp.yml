name: Build WuAiZhiBo iOS v1.0

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Restore brand artwork
        shell: bash
        run: |
          cd wuaizhibo-ios-v1.0
          python3 - <<'PY'
          from pathlib import Path
          import base64
          raw = base64.b64decode(Path('brand/icon-flat.png.b64').read_text(encoding='utf-8').strip())
          Path('/tmp/wuai-icon-source.png').write_bytes(raw)
          PY

          mkdir -p WuAiZhiBo/Assets.xcassets/AppIcon.appiconset
          mkdir -p WuAiZhiBo/Assets.xcassets/BrandLogo.imageset

          sips -s format png -z 1024 1024 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-1024.png >/dev/null
          sips -s format png -z 40 40 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-40.png >/dev/null
          sips -s format png -z 60 60 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-60.png >/dev/null
          sips -s format png -z 58 58 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-58.png >/dev/null
          sips -s format png -z 87 87 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-87.png >/dev/null
          sips -s format png -z 80 80 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-80.png >/dev/null
          sips -s format png -z 120 120 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-120.png >/dev/null
          cp WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-120.png WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-120-60.png
          sips -s format png -z 180 180 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/AppIcon.appiconset/Icon-180.png >/dev/null

          sips -s format png -z 256 256 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/BrandLogo.imageset/BrandLogo-256.png >/dev/null
          sips -s format png -z 512 512 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/BrandLogo.imageset/BrandLogo-512.png >/dev/null
          sips -s format png -z 768 768 /tmp/wuai-icon-source.png --out WuAiZhiBo/Assets.xcassets/BrandLogo.imageset/BrandLogo-768.png >/dev/null

      - name: Build unsigned device app
        shell: bash
        run: |
          cd wuaizhibo-ios-v1.0
          rm -rf build
          xcodebuild \
            -project WuAiZhiBo.xcodeproj \
            -target WuAiZhiBo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA and source
        shell: bash
        run: |
          cd wuaizhibo-ios-v1.0
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/WuAiZhiBo.app"
          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload" out
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/wuaizhibo-ios-v1.0/out/WuAiZhiBo-iOS-v1.0-unsigned.ipa" Payload)
          cd "$GITHUB_WORKSPACE"
          zip -qry "wuaizhibo-ios-v1.0/out/WuAiZhiBo-iOS-v1.0-source.zip" wuaizhibo-ios-v1.0 -x 'wuaizhibo-ios-v1.0/build/*' 'wuaizhibo-ios-v1.0/out/*'
          shasum -a 256 wuaizhibo-ios-v1.0/out/WuAiZhiBo-iOS-v1.0-unsigned.ipa > wuaizhibo-ios-v1.0/out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wuaizhibo-ios-v1.0-build
          path: wuaizhibo-ios-v1.0/out/
          if-no-files-found: error
