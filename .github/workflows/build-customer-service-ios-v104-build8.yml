name: Build Customer Service iOS V1.0.4 Build 8

on:
  push:
    branches:
      - customer-service-ios-v104-build8-temp2
    paths:
      - 'customer-service-ios-v104-build8.patch'
      - '.github/workflows/build-customer-service-ios-v104-build8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-service-ios-v104-build8-public-temp2
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen imagemagick

      - name: Restore V1.0.4 Build 7 baseline and apply Build 8 patch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/customer-service-ios-v104-build8"
          cat customer-service-ios-v104-build7-source.part00 customer-service-ios-v104-build7-source.part01 customer-service-ios-v104-build7-source.part02 > "$RUNNER_TEMP/source.b64"
          base64 -D -i "$RUNNER_TEMP/source.b64" -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/customer-service-ios-v104-build8"
          cd "$RUNNER_TEMP/customer-service-ios-v104-build8"
          patch -p1 < "$GITHUB_WORKSPACE/customer-service-ios-v104-build8.patch"
          grep -q 'MARKETING_VERSION: 1.0.4' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 8' project.yml
          grep -q 'AppMediaViewer' CustomerServiceApp/RootView.swift
          grep -q 'ZoomableImage' CustomerServiceApp/RootView.swift
          grep -q '关闭预览' CustomerServiceApp/RootView.swift

      - name: Render app icon and launch assets
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/customer-service-ios-v104-build8/CustomerServiceApp"
          magick -background none "$SRC/BrandIcon.svg" -resize '1024x1024!' -alpha off "$SRC/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          magick -background none "$SRC/BrandIcon.svg" -resize '240x240!' -alpha off "$SRC/Assets.xcassets/AppLoginLogo.imageset/AppLoginLogo.jpg"
          magick -background none "$SRC/LaunchBackground.svg" -resize '430x932!' -alpha off "$SRC/Assets.xcassets/LaunchBackground.imageset/LaunchBackground.jpg"

      - name: Generate Xcode project
        working-directory: ${{ runner.temp }}/customer-service-ios-v104-build8
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project CustomerServiceApp.xcodeproj -scheme CustomerServiceApp -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|IPHONEOS_DEPLOYMENT_TARGET'

      - name: Build unsigned Release app
        working-directory: ${{ runner.temp }}/customer-service-ios-v104-build8
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/CustomerServiceDerivedData"
          xcodebuild \
            -project CustomerServiceApp.xcodeproj \
            -scheme CustomerServiceApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/CustomerServiceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Validate and package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/CustomerServiceDerivedData/Build/Products/Release-iphoneos/CustomerServiceApp.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$APP/CustomerServiceApp"
          test -f "$APP/Assets.car"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          test "$BUNDLE" = 'com.yuyanfriends.app'
          test "$VERSION" = '1.0.4'
          test "$BUILD" = '8'
          /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST" | grep -q '^LaunchScreen$'
          OUT="$RUNNER_TEMP/CustomerService_iOS_V1.0.4_Build8_Unsigned"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/CustomerServiceApp.app"
          rm -rf "$OUT/Payload/CustomerServiceApp.app/_CodeSignature"
          rm -f "$OUT/Payload/CustomerServiceApp.app/embedded.mobileprovision"
          cd "$OUT"
          /usr/bin/zip -qry "$RUNNER_TEMP/CustomerService_iOS_V1.0.4_Build8_Unsigned.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/CustomerService_iOS_V1.0.4_Build8_Unsigned.ipa" > "$RUNNER_TEMP/CustomerService_iOS_V1.0.4_Build8_Unsigned_SHA256.txt"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CustomerService_iOS_V1.0.4_Build8_Unsigned_IPA_PublicTemp
          path: |
            ${{ runner.temp }}/CustomerService_iOS_V1.0.4_Build8_Unsigned.ipa
            ${{ runner.temp }}/CustomerService_iOS_V1.0.4_Build8_Unsigned_SHA256.txt
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: error

      - name: Write build result back
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          RESULT_DIR="$GITHUB_WORKSPACE/customer-service-ios-v104-build8-result"
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"
          {
            echo 'Customer Service iOS V1.0.4 Build 8 public temporary build'
            echo "status=$JOB_STATUS"
            echo "source_commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "generated_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$RESULT_DIR/status.txt"
          [ -f "$RUNNER_TEMP/CustomerService_iOS_V1.0.4_Build8_Unsigned_SHA256.txt" ] && cp "$RUNNER_TEMP/CustomerService_iOS_V1.0.4_Build8_Unsigned_SHA256.txt" "$RESULT_DIR/"
          [ -f "$RUNNER_TEMP/xcodebuild.log" ] && tail -n 300 "$RUNNER_TEMP/xcodebuild.log" > "$RESULT_DIR/xcodebuild-tail.log"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f "$RESULT_DIR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CI result Customer Service iOS V1.0.4 Build 8: $JOB_STATUS"
          git pull --rebase origin customer-service-ios-v104-build8-temp2 || true
          git push origin HEAD:customer-service-ios-v104-build8-temp2
