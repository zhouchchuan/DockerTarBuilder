name: BT Mobile Base IPA Fetch

on:
  pull_request:
    branches: [ master ]

jobs:
  fetch-base:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified upstream iTorrent IPA
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://github.com/XITRIX/iTorrent/releases/download/v2.2.0-1/iTorrent.ipa' \
            -o "$RUNNER_TEMP/BTMobile-base.ipa"
          unzip -t "$RUNNER_TEMP/BTMobile-base.ipa" >/dev/null
          sha256sum "$RUNNER_TEMP/BTMobile-base.ipa"
      - name: Upload base IPA
        uses: actions/upload-artifact@v4
        with:
          name: BTMobile-base-ipa
          path: ${{ runner.temp }}/BTMobile-base.ipa
          retention-days: 3
