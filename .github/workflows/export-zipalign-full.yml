name: Export Zipalign Full

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  export-zipalign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
      - name: Collect zipalign runtime
        shell: bash
        run: |
          mkdir -p out/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" out/lib64/libc++.so
          chmod +x out/zipalign
          LD_LIBRARY_PATH="$PWD/out/lib64" out/zipalign -h >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-full-36
          path: out/
          if-no-files-found: error
