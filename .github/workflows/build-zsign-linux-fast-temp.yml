name: Build zsign Linux fast helper

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  build-zsign-fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check toolchain
        run: |
          g++ --version
          pkg-config --version
          openssl version
          test -f /usr/include/openssl/ssl.h

      - name: Build zsign
        shell: bash
        run: |
          git clone --depth=1 https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign/build/linux
          make clean
          make -j2
          ./zsign -v || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp zsign "$GITHUB_WORKSPACE/out/zsign-linux"
          chmod +x "$GITHUB_WORKSPACE/out/zsign-linux"
          sha256sum "$GITHUB_WORKSPACE/out/zsign-linux" > "$GITHUB_WORKSPACE/out/zsign-linux-SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: zsign-linux-fast-helper
          path: out/
          if-no-files-found: error
