name: Build qBittorrent Precision 0.1.5 for DS1823xs+

on:
  workflow_dispatch:
  push:
    branches:
      - qbittorrent-precision-lsio
    paths:
      - docker/lsio/**
      - .github/workflows/precision-lsio-base.yml

permissions:
  contents: read

jobs:
  build-amd64-tar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify peer lifecycle safety invariants
        shell: bash
        run: |
          set -euo pipefail
          patch='docker/lsio/patches/0005-fix-precision-peer-lifecycle-stability.patch'
          grep -F '+        const BitTorrent::PeerAddress m_endpoint;' "${patch}"
          grep -F '+                throw std::runtime_error {"Peer endpoint is banned"};' "${patch}"
          if grep -F '+        lt::peer_connection_handle m_connection;' "${patch}"; then
            echo 'The endpoint plugin must not retain a live peer connection handle.' >&2
            exit 1
          fi
          if grep -F '+                m_connection.disconnect' "${patch}"; then
            echo 'The endpoint plugin must let libtorrent close the connection safely.' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build V0.1.5 image TAR
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/lsio/Dockerfile
          platforms: linux/amd64
          tags: qbittorrent-precision:0.1.5
          outputs: type=docker,dest=${{ runner.temp }}/qbittorrent-precision-ds1823xs-0.1.5-amd64.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=precision-lsio-endpoint-amd64
          cache-to: type=gha,mode=max,scope=precision-lsio-endpoint-amd64

      - name: Verify image and LinuxServer runtime
        shell: bash
        run: |
          set -euo pipefail
          image="qbittorrent-precision:0.1.5"
          container="precision-lsio-smoke"
          peer_container="precision-lsio-peer"
          config_dir="${RUNNER_TEMP}/precision-lsio-config"
          downloads_dir="${RUNNER_TEMP}/precision-lsio-downloads"
          peer_config_dir="${RUNNER_TEMP}/precision-lsio-peer-config"
          peer_downloads_dir="${RUNNER_TEMP}/precision-lsio-peer-downloads"

          docker load --input "${RUNNER_TEMP}/qbittorrent-precision-ds1823xs-0.1.5-amd64.tar"
          test "$(docker image inspect --format '{{.Architecture}}' "${image}")" = "amd64"
          docker run --rm --entrypoint /app/qbittorrent-nox "${image}" --version | grep -F "qBittorrent v5.2.3"

          mkdir -p "${config_dir}" "${downloads_dir}"
          docker run --detach \
            --name "${container}" \
            --network host \
            --env PUID=1000 \
            --env PGID=1000 \
            --env TZ=Etc/UTC \
            --env WEBUI_PORT=19191 \
            --env TORRENTING_PORT=32851 \
            --volume "${config_dir}:/config" \
            --volume "${downloads_dir}:/downloads" \
            "${image}"

          cleanup() {
            docker rm --force "${peer_container}" >/dev/null 2>&1 || true
            docker rm --force "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Running}}' "${container}")" = "true"
            if curl --silent --fail --max-time 2 "http://127.0.0.1:19191/" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1"

          sleep 10
          test "$(docker inspect --format '{{.State.Running}}' "${container}")" = "true"
          grep -F "LegalNotice" "${config_dir}/qBittorrent/qBittorrent.conf"
          test "$(docker image inspect --format '{{index .Config.Labels "io.qbittorrent-precision.endpoint-control"}}' "${image}")" = "ip+port"
          test "$(docker image inspect --format '{{index .Config.Labels "io.qbittorrent-precision.manual-ban-rules"}}' "${image}")" = "ip-or-ip+port"
          test "$(docker image inspect --format '{{index .Config.Labels "io.qbittorrent-precision.libtorrent-ref"}}' "${image}")" = "v2.0.14"
          docker run --rm --entrypoint grep "${image}" -F 'libtorrent v2.0.14 (aab2a10e2f60d9eac78e885a696736d043527794)' /sbom-precision.txt

          # Enable an authentication bypass only for the CI runner's loopback
          # address. This avoids depending on LinuxServer's presentation of the
          # random first-start password and does not change image defaults.
          docker stop "${container}"
          awk '
            /^\[Preferences\]$/ {
              print
              print "WebUI\\AuthSubnetWhitelist=127.0.0.1/32"
              print "WebUI\\AuthSubnetWhitelistEnabled=true"
              next
            }
            { print }
          ' "${config_dir}/qBittorrent/qBittorrent.conf" \
            > "${RUNNER_TEMP}/qBittorrent.conf"
          sudo mv "${RUNNER_TEMP}/qBittorrent.conf" "${config_dir}/qBittorrent/qBittorrent.conf"
          sudo chown 1000:1000 "${config_dir}/qBittorrent/qBittorrent.conf"
          grep -F 'WebUI\AuthSubnetWhitelist=127.0.0.1/32' "${config_dir}/qBittorrent/qBittorrent.conf"
          grep -F 'WebUI\AuthSubnetWhitelistEnabled=true' "${config_dir}/qBittorrent/qBittorrent.conf"
          docker start "${container}"
          ready=0
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Running}}' "${container}")" = "true"
            if curl --silent --fail --max-time 2 "http://127.0.0.1:19191/api/v2/app/version" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1"

          curl --silent --show-error --fail-with-body \
            'http://127.0.0.1:19191/api/v2/app/preferences' \
            > "${RUNNER_TEMP}/preferences-default.json"
          jq -e '.web_ui_session_timeout == 604800' \
            "${RUNNER_TEMP}/preferences-default.json"
          curl --silent --show-error --fail-with-body \
            'http://127.0.0.1:19191/scripts/misc.js' \
            | grep -F 'buildTorrentUploadBatch'
          curl --silent --show-error --fail-with-body \
            'http://127.0.0.1:19191/addtorrent.html' \
            | grep -F 'addtorrent_batch_metadata'

          curl --silent --show-error --fail-with-body \
            --data-urlencode 'json={"banned_IPs":"192.0.2.10:6881\n192.0.2.20\n[2001:db8::1]:6881","web_ui_session_timeout":43200}' \
            'http://127.0.0.1:19191/api/v2/app/setPreferences'
          curl --silent --show-error --fail-with-body \
            --data-urlencode 'peers=192.0.2.30:6883' \
            'http://127.0.0.1:19191/api/v2/transfer/banPeers'

          curl --silent --show-error --fail-with-body \
            'http://127.0.0.1:19191/api/v2/app/preferences' \
            > "${RUNNER_TEMP}/preferences.json"
          jq -e '.banned_IPs | split("\n") | sort == ["192.0.2.10:6881", "192.0.2.20", "192.0.2.30:6883", "[2001:db8::1]:6881"]' \
            "${RUNNER_TEMP}/preferences.json"
          jq -e '.web_ui_session_timeout == 43200' \
            "${RUNNER_TEMP}/preferences.json"

          docker stop "${container}"
          grep -F 'BannedIPs=192.0.2.20' "${config_dir}/qBittorrent/qBittorrent.conf"
          grep -F 'BannedPeerEndpoints' "${config_dir}/qBittorrent/qBittorrent.conf"
          grep -F '192.0.2.10:6881' "${config_dir}/qBittorrent/qBittorrent.conf"
          grep -F '192.0.2.30:6883' "${config_dir}/qBittorrent/qBittorrent.conf"

          docker start "${container}"
          ready=0
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Running}}' "${container}")" = "true"
            if curl --silent --fail --max-time 2 "http://127.0.0.1:19191/" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1"

          curl --silent --show-error --fail-with-body \
            'http://127.0.0.1:19191/api/v2/app/preferences' \
            > "${RUNNER_TEMP}/preferences-restart.json"
          jq -e '.banned_IPs | split("\n") | sort == ["192.0.2.10:6881", "192.0.2.20", "192.0.2.30:6883", "[2001:db8::1]:6881"]' \
            "${RUNNER_TEMP}/preferences-restart.json"
          jq -e '.web_ui_session_timeout == 43200' \
            "${RUNNER_TEMP}/preferences-restart.json"

          # Exercise the old crash path with a real peer. While libtorrent is
          # repeatedly building peer-info snapshots, add the exact live
          # endpoint to the ban list and assert that qBittorrent itself neither
          # exits nor restarts. The second instance is deliberately unmodified:
          # it represents an ordinary BT/Xunlei-compatible peer connection.
          sudo truncate -s 33554432 "${downloads_dir}/precision-stress.bin"
          torrent_file="${RUNNER_TEMP}/precision-stress.torrent"
          STRESS_FILE="${downloads_dir}/precision-stress.bin" \
          TORRENT_FILE="${torrent_file}" \
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ["STRESS_FILE"])
          target = Path(os.environ["TORRENT_FILE"])
          data = source.read_bytes()
          piece_length = 256 * 1024

          def bencode(value):
              if isinstance(value, int):
                  return b"i" + str(value).encode() + b"e"
              if isinstance(value, bytes):
                  return str(len(value)).encode() + b":" + value
              if isinstance(value, dict):
                  return b"d" + b"".join(
                      bencode(key) + bencode(value[key]) for key in sorted(value)
                  ) + b"e"
              raise TypeError(type(value))

          pieces = b"".join(
              hashlib.sha1(data[offset:offset + piece_length]).digest()
              for offset in range(0, len(data), piece_length)
          )
          target.write_bytes(bencode({
              b"info": {
                  b"length": len(data),
                  b"name": source.name.encode(),
                  b"piece length": piece_length,
                  b"pieces": pieces,
              }
          }))
          PY
          sudo chown -R 1000:1000 "${downloads_dir}"

          mkdir -p "${peer_config_dir}" "${peer_downloads_dir}"
          docker run --detach \
            --name "${peer_container}" \
            --network host \
            --env PUID=1000 \
            --env PGID=1000 \
            --env TZ=Etc/UTC \
            --env WEBUI_PORT=19192 \
            --env TORRENTING_PORT=32852 \
            --volume "${peer_config_dir}:/config" \
            --volume "${peer_downloads_dir}:/downloads" \
            "${image}"

          ready=0
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Running}}' "${peer_container}")" = "true"
            if curl --silent --fail --max-time 2 'http://127.0.0.1:19192/' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1"

          docker stop "${peer_container}"
          awk '
            /^\[Preferences\]$/ {
              print
              print "WebUI\\AuthSubnetWhitelist=127.0.0.1/32"
              print "WebUI\\AuthSubnetWhitelistEnabled=true"
              next
            }
            { print }
          ' "${peer_config_dir}/qBittorrent/qBittorrent.conf" \
            > "${RUNNER_TEMP}/qBittorrent-peer.conf"
          sudo mv "${RUNNER_TEMP}/qBittorrent-peer.conf" "${peer_config_dir}/qBittorrent/qBittorrent.conf"
          sudo chown 1000:1000 "${peer_config_dir}/qBittorrent/qBittorrent.conf"
          docker start "${peer_container}"

          ready=0
          for attempt in $(seq 1 45); do
            test "$(docker inspect --format '{{.State.Running}}' "${peer_container}")" = "true"
            if curl --silent --fail --max-time 2 'http://127.0.0.1:19192/api/v2/app/version' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "${ready}" = "1"

          curl --silent --show-error --fail-with-body \
            --form "torrents=@${torrent_file}" \
            --form 'savepath=/downloads' \
            --form 'skip_checking=true' \
            --form 'stopped=false' \
            'http://127.0.0.1:19191/api/v2/torrents/add'
          curl --silent --show-error --fail-with-body \
            --form "torrents=@${torrent_file}" \
            --form 'savepath=/downloads' \
            --form 'stopped=false' \
            'http://127.0.0.1:19192/api/v2/torrents/add'

          stress_hash=''
          for attempt in $(seq 1 30); do
            stress_hash="$(curl --silent --show-error --fail-with-body \
              'http://127.0.0.1:19191/api/v2/torrents/info' \
              | jq -r '.[] | select(.name == "precision-stress.bin") | .hash' \
              | head -n 1)"
            if test -n "${stress_hash}"; then
              break
            fi
            sleep 1
          done
          test -n "${stress_hash}"

          curl --silent --show-error --fail-with-body \
            --data-urlencode "hashes=${stress_hash}" \
            --data-urlencode 'peers=127.0.0.1:32851' \
            'http://127.0.0.1:19192/api/v2/torrents/addPeers'

          peer_endpoint=''
          for attempt in $(seq 1 45); do
            peer_endpoint="$(curl --silent --show-error --fail-with-body \
              "http://127.0.0.1:19191/api/v2/sync/torrentPeers?hash=${stress_hash}&rid=0" \
              | jq -r '(.peers // {}) | keys[]' \
              | head -n 1)"
            if test -n "${peer_endpoint}"; then
              break
            fi
            sleep 1
          done
          test -n "${peer_endpoint}"

          qbt_pid_before="$(docker exec "${container}" pidof qbittorrent-nox)"
          test -n "${qbt_pid_before}"
          reader_pids=()
          for reader in $(seq 1 4); do
            (
              for request in $(seq 1 200); do
                curl --silent --show-error --fail --max-time 3 \
                  "http://127.0.0.1:19191/api/v2/sync/torrentPeers?hash=${stress_hash}&rid=0" \
                  >/dev/null
              done
            ) &
            reader_pids+=("$!")
          done

          curl --silent --show-error --fail-with-body \
            --data-urlencode "peers=${peer_endpoint}" \
            'http://127.0.0.1:19191/api/v2/transfer/banPeers'
          for reader_pid in "${reader_pids[@]}"; do
            wait "${reader_pid}"
          done
          sleep 3

          qbt_pid_after="$(docker exec "${container}" pidof qbittorrent-nox)"
          test "${qbt_pid_before}" = "${qbt_pid_after}"
          curl --silent --show-error --fail-with-body \
            'http://127.0.0.1:19191/api/v2/app/version' \
            | grep -F '5.2.3'
          if docker logs "${container}" 2>&1 | grep -E 'Caught signal: SIGSEGV|Segmentation fault'; then
            echo 'qBittorrent crashed during exact endpoint enforcement.' >&2
            exit 1
          fi

          sha256sum "${RUNNER_TEMP}/qbittorrent-precision-ds1823xs-0.1.5-amd64.tar" \
            > "${RUNNER_TEMP}/qbittorrent-precision-ds1823xs-0.1.5-amd64.tar.sha256"

      - name: Upload DS1823xs+ image package
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-precision-ds1823xs-0.1.5-amd64
          path: |
            ${{ runner.temp }}/qbittorrent-precision-ds1823xs-0.1.5-amd64.tar
            ${{ runner.temp }}/qbittorrent-precision-ds1823xs-0.1.5-amd64.tar.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

