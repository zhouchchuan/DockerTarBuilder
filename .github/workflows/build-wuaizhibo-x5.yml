name: Build WuAiZhiBo X5 v1.2

on:
  push:
    branches: [wuaizhibo-x5-v1.2-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Decode brand assets
        shell: bash
        run: |
          cd wuaizhibo-x5-v1.2
          mkdir -p app/src/main/res/drawable-nodpi
          cat > /tmp/splash.b64 <<'EOF'

EOF
          base64 -d /tmp/splash.b64 > app/src/main/res/drawable-nodpi/splash_brand.jpg
          cat > /tmp/icon.b64 <<'EOF'

EOF
          base64 -d /tmp/icon.b64 > app/src/main/res/drawable-nodpi/app_icon.jpg

      - name: Build release APK
        shell: bash
        run: |
          cd wuaizhibo-x5-v1.2
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Package unsigned APK and signing tools
        shell: bash
        run: |
          mkdir -p out/apksigner-lib
          cp wuaizhibo-x5-v1.2/app/build/outputs/apk/release/app-release-unsigned.apk out/WuAiZhiBo-v1.2-X5-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/apksigner-lib/apksigner.jar
          chmod +x out/apksigner
          sha256sum out/WuAiZhiBo-v1.2-X5-unsigned.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wuaizhibo-x5-v1.2-build
          path: out/
          if-no-files-found: error
