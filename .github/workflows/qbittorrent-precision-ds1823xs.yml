name: Build qBittorrent Precision for DS1823xs+

on:
  push:
    branches:
      - "qbittorrent-precision-ds1823xs"
    paths:
      - "qbittorrent-precision/ds1823xs/**"
      - ".github/workflows/qbittorrent-precision-ds1823xs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64-tar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build DS1823xs+ image TAR
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: qbittorrent-precision/ds1823xs/Dockerfile
          platforms: linux/amd64
          tags: qbittorrent-precision:0.1.0-base
          outputs: type=docker,dest=${{ runner.temp }}/qbittorrent-precision-ds1823xs-0.1.0-base-amd64.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=qbittorrent-precision-ds1823xs-amd64
          cache-to: type=gha,mode=max,scope=qbittorrent-precision-ds1823xs-amd64

      - name: Verify exported image
        shell: bash
        run: |
          docker load --input "${RUNNER_TEMP}/qbittorrent-precision-ds1823xs-0.1.0-base-amd64.tar"
          test "$(docker image inspect --format '{{.Architecture}}' qbittorrent-precision:0.1.0-base)" = "amd64"
          docker run --rm --entrypoint /usr/bin/qbittorrent-nox \
            qbittorrent-precision:0.1.0-base --version \
            | grep -F "qBittorrent v5.2.3"
          sha256sum "${RUNNER_TEMP}/qbittorrent-precision-ds1823xs-0.1.0-base-amd64.tar" \
            > "${RUNNER_TEMP}/qbittorrent-precision-ds1823xs-0.1.0-base-amd64.tar.sha256"

      - name: Upload DS1823xs+ image package
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-precision-ds1823xs-0.1.0-base-amd64
          path: |
            ${{ runner.temp }}/qbittorrent-precision-ds1823xs-0.1.0-base-amd64.tar
            ${{ runner.temp }}/qbittorrent-precision-ds1823xs-0.1.0-base-amd64.tar.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

