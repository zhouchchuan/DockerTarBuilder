name: BTMobile 0.1.4 Temporary Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Checkout iTorrent v2.2.0-1
        run: |
          git clone --depth 1 --branch v2.2.0-1 --recurse-submodules https://github.com/XITRIX/iTorrent.git "$RUNNER_TEMP/iTorrent"
          cd "$RUNNER_TEMP/iTorrent"
          git submodule update --init --recursive

      - name: Apply frozen BTMobile 0.1.3 BT baseline
        run: |
          BTMOBILE_SRC="$RUNNER_TEMP/iTorrent" python3 btmobile_v013_patch.py
          grep -n "dht_bootstrap_nodes\|peerStats\|Peer 连接详情\|normalizedMagnetString" \
            "$RUNNER_TEMP/iTorrent/Submodules/LibTorrent-Swift/LibTorrent/Core/SessionSettings/SessionSettings.mm" \
            "$RUNNER_TEMP/iTorrent/Submodules/LibTorrent-Swift/LibTorrent/Core/TorrentHandle/TorrentHandle.mm" \
            "$RUNNER_TEMP/iTorrent/iTorrent/Screens/TorrentDetails/TorrentDetailsViewModel.swift" \
            "$RUNNER_TEMP/iTorrent/iTorrent/Screens/TorrentList/TorrentListViewController.swift"

      - name: Apply BTMobile 0.1.4 file management patch
        run: |
          BTMOBILE_SRC="$RUNNER_TEMP/iTorrent" python3 btmobile_v014_patch.py
          grep -R -n "BTFileBrowserViewController\|savePath:(NSURL\|isBTMobileStreamableMedia\|ZipArchive" \
            "$RUNNER_TEMP/iTorrent/iTorrent/Screens" \
            "$RUNNER_TEMP/iTorrent/Submodules/LibTorrent-Swift/LibTorrent/Core/Session" \
            "$RUNNER_TEMP/iTorrent/iTorrent.xcodeproj/project.pbxproj" | head -100

      - name: Verify V0.1.3 DHT core unchanged by V0.1.4
        run: |
          grep -q 'dht_bootstrap_nodes' "$RUNNER_TEMP/iTorrent/Submodules/LibTorrent-Swift/LibTorrent/Core/SessionSettings/SessionSettings.mm"
          grep -q 'router.bittorrent.com:6881' "$RUNNER_TEMP/iTorrent/Submodules/LibTorrent-Swift/LibTorrent/Core/SessionSettings/SessionSettings.mm"
          grep -q 'normalizedMagnetString' "$RUNNER_TEMP/iTorrent/iTorrent/Screens/TorrentList/TorrentListViewController.swift"
          grep -q 'peerStats' "$RUNNER_TEMP/iTorrent/Submodules/LibTorrent-Swift/LibTorrent/Core/TorrentHandle/TorrentHandle.mm"

      - name: Add stable Firebase client plist
        run: |
          cat > "$RUNNER_TEMP/iTorrent/iTorrent/Core/Assets/GoogleService-Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>API_KEY</key><string>AIzaSyAEbFIIBWkytOKKoVuPppStHButfHK3HVM</string>
          <key>GCM_SENDER_ID</key><string>612867314720</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.xitrix.iTorrent2</string>
          <key>PROJECT_ID</key><string>itorrent-fdb49</string>
          <key>STORAGE_BUCKET</key><string>itorrent-fdb49.appspot.com</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><true/>
          <key>IS_GCM_ENABLED</key><true/>
          <key>IS_SIGNIN_ENABLED</key><true/>
          <key>GOOGLE_APP_ID</key><string>1:612867314720:ios:0fec2b66005070d3b55845</string>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/iTorrent/iTorrent/Core/Assets/GoogleService-Info.plist"

      - name: Prepare dependencies
        run: |
          brew install boost
          cd "$RUNNER_TEMP/iTorrent"
          chmod +x ./Submodules/LibTorrent-Swift/make.sh
          ./Submodules/LibTorrent-Swift/make.sh
          xcodebuild -resolvePackageDependencies -workspace iTorrent.xcworkspace -scheme iTorrent

      - name: Package patched source
        run: |
          cd "$RUNNER_TEMP"
          find iTorrent -name .DS_Store -delete
          zip -qry "$RUNNER_TEMP/BTMobile_V0.1.4_Source.zip" iTorrent \
            -x 'iTorrent/.git/*' 'iTorrent/.git' '*/.git/*' '*/.git' \
               '*/DerivedData/*' '*/build/*' '*.p12' '*.pfx' '*.mobileprovision' '*.provisionprofile'

      - name: Compile unsigned iOS application
        run: |
          cd "$RUNNER_TEMP/iTorrent"
          xcodebuild \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            MARKETING_VERSION='0.1.4' \
            CURRENT_PROJECT_VERSION='14' \
            clean build

      - name: Validate and package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "0.1.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "14"
          file "$APP/iTorrent"
          grep -q 'ZipArchive' "$RUNNER_TEMP/iTorrent/iTorrent.xcodeproj/project.pbxproj"
          rm -rf "$APP/_CodeSignature" "$APP/PlugIns" "$APP/Watch"
          rm -f "$APP/embedded.mobileprovision"
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          ditto "$APP" "$RUNNER_TEMP/unsigned/Payload/iTorrent.app"
          cd "$RUNNER_TEMP/unsigned"
          zip -qry "$RUNNER_TEMP/BTMobile_V0.1.4_Unsigned.ipa" Payload

      - name: Download Linux zsign for private local signing
        run: |
          curl -L --fail --retry 3 https://github.com/zhlynn/zsign/releases/download/v1.1.1/zsign-linux-x86_64.tar.gz -o "$RUNNER_TEMP/zsign-linux-x86_64.tar.gz"
          echo '65873b256b8902715cc81c8c467e9dddb315a2b484c6d0f5fb2031bad819d8ba  '"$RUNNER_TEMP/zsign-linux-x86_64.tar.gz" | shasum -a 256 -c -

      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 BTMobile_V0.1.4_Unsigned.ipa BTMobile_V0.1.4_Source.zip zsign-linux-x86_64.tar.gz > BTMobile_V0.1.4_Build_SHA256.txt

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: BTMobile-V0.1.4-build-products
          compression-level: 0
          path: |
            ${{ runner.temp }}/BTMobile_V0.1.4_Unsigned.ipa
            ${{ runner.temp }}/BTMobile_V0.1.4_Source.zip
            ${{ runner.temp }}/BTMobile_V0.1.4_Build_SHA256.txt
            ${{ runner.temp }}/zsign-linux-x86_64.tar.gz
