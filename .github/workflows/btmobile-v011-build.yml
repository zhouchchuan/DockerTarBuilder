name: BT Mobile iOS V0.1.1 Build

on:
  pull_request:
    branches: [ master ]

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout build patch
        uses: actions/checkout@v4
        with:
          path: ci
          fetch-depth: 1

      - name: Checkout iTorrent base
        uses: actions/checkout@v4
        with:
          repository: XITRIX/iTorrent
          ref: v2.2.0-1
          submodules: recursive
          fetch-depth: 1
          path: src

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Apply BT Mobile V0.1.1 patches
        run: |
          python3 ci/btmobile_v011_patch2.py
          python3 ci/btmobile_v011_swiftfix.py

      - name: Prepare libtorrent
        run: |
          brew install boost
          cd src
          cat > iTorrent/Core/Assets/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CLIENT_ID</key><string>disabled</string>
          <key>REVERSED_CLIENT_ID</key><string>disabled</string>
          <key>API_KEY</key><string>disabled</string>
          <key>GCM_SENDER_ID</key><string>0</string>
          <key>PLIST_VERSION</key><string>1</string>
          <key>BUNDLE_ID</key><string>com.chatapp.bqimvip</string>
          <key>PROJECT_ID</key><string>btmobile-local</string>
          <key>STORAGE_BUCKET</key><string>btmobile-local.invalid</string>
          <key>IS_ADS_ENABLED</key><false/>
          <key>IS_ANALYTICS_ENABLED</key><false/>
          <key>IS_APPINVITE_ENABLED</key><false/>
          <key>IS_GCM_ENABLED</key><false/>
          <key>IS_SIGNIN_ENABLED</key><false/>
          <key>GOOGLE_APP_ID</key><string>1:0:ios:0000000000000000</string>
          </dict></plist>
          PLIST
          chmod +x ./Submodules/LibTorrent-Swift/make.sh
          ./Submodules/LibTorrent-Swift/make.sh

      - name: Build unsigned iPhone app
        run: |
          cd src
          set -euxo pipefail
          xcodebuild \
            -workspace iTorrent.xcworkspace \
            -scheme "iTorrent" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="0.1.1" \
            CURRENT_PROJECT_VERSION="11" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          rm -rf "$APP_PATH/_CodeSignature" "$APP_PATH/PlugIns" "$APP_PATH/Watch" "$APP_PATH/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BT Mobile" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName BTMobile" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.1.1" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 11" "$APP_PATH/Info.plist" || true
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/BTMobile.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/BTMobile-v0.1.1-unsigned.ipa" Payload
          shasum -a 256 "$RUNNER_TEMP/BTMobile-v0.1.1-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BTMobile-v0.1.1-unsigned
          path: ${{ runner.temp }}/BTMobile-v0.1.1-unsigned.ipa
          retention-days: 3
