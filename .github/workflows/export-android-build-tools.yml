name: Export Android Build Tools

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

jobs:
  export-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
      - name: Collect tools
        shell: bash
        run: |
          mkdir -p out/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" out/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" out/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/zipalign out/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36
          path: out/
          if-no-files-found: error
