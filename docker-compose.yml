services:
  peerbander-beyonder:
    image: peerbander-beyonder:0.0.5
    container_name: peerbander-beyonder
    network_mode: host
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      PBB_WEBUI_PORT: "9899"
      PBB_DATA_DIR: /data
      TZ: Asia/Shanghai
      # 可选：仅供旧版 API 自动化兼容；WebUI 始终使用首次创建的管理员账号登录。
      # PBB_ADMIN_TOKEN: 请改成足够长的随机字符串
    volumes:
      - ./data:/data
