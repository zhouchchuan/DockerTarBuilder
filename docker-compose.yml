services:
  peerbander-beyonder:
    image: peerbander-beyonder:0.0.4
    container_name: peerbander-beyonder
    network_mode: host
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      PBB_WEBUI_PORT: "9899"
      PBB_DATA_DIR: /data
      TZ: Asia/Shanghai
      # 可选：启用后，打开 WebUI 时需要输入同一个管理令牌。
      # PBB_ADMIN_TOKEN: 请改成足够长的随机字符串
    volumes:
      - ./data:/data
